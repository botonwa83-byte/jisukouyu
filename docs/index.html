<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极速口语 · 支持中心</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff7f0 0%, #ffe9e0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #3b2f2a;
  }
  .card {
    background: #fffdfa;
    max-width: 560px;
    width: 100%;
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(220, 130, 90, 0.15);
  }
  .logo {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: linear-gradient(135deg, #ff8a5c, #ff6b8a);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 800; color: #fff;
    margin: 0 auto 18px;
  }
  h1 { text-align: center; font-size: 24px; margin-bottom: 6px; }
  p.sub { text-align: center; color: #9b8a80; font-size: 14px; margin-bottom: 28px; }
  a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; margin-bottom: 12px;
    background: #fff7f0; border: 1px solid #f5e3d8; border-radius: 14px;
    color: #ff6b4a; text-decoration: none; font-weight: 600; font-size: 16px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(220,130,90,.15); }
  a span.arrow { color: #cbb; font-size: 18px; }
  footer { text-align: center; color: #b5a69c; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">说</div>
    <h1>极速口语</h1>
    <p class="sub">支持中心</p>
    <a href="./privacy.html">隐私政策 <span class="arrow">›</span></a>
    <a href="./terms.html">用户协议 <span class="arrow">›</span></a>
    <a href="./support.html">技术支持 <span class="arrow">›</span></a>
    <footer>© 2024-2026 King Top. All rights reserved.</footer>
  </div>
</body>
</html>
