<h1>极速口语 技术支持</h1>

<h2>常见问题</h2>
<ul>
  <li><strong>AI 点评提示「还没填 API Key」？</strong>打开「我的 · 设置 · AI 设置」，选择服务商并保存密钥。Key 只存在本机钥匙串。</li>
  <li><strong>验证连通性失败？</strong>检查端点地址与密钥是否来自同一家服务商；用中转站密钥时请选「自建 / 兼容端点」并填入中转地址。</li>
  <li><strong>跟读没有得分？</strong>需要在系统设置中允许麦克风与语音识别权限，并在安静环境下朗读目标句子。</li>
  <li><strong>学习进度会同步吗？</strong>不会。所有进度只保存在本机，删除应用即清除。</li>
</ul>

<h2>联系我们</h2>
<p>以上无法解决时，请在 App Store「评分与评论」下方或应用商店页面的支持链接中留言，我们会尽快回复。</p>
